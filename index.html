<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>จัดการ — Easypage</title>
<link rel="stylesheet" href="base.css?v=4">
<style>
:root{--maxw:1100px}
#q{flex:1 1 240px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.stat.ok b{color:var(--ok)}.stat.wait b{color:var(--wait)}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:13.5px;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
td.code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14px;white-space:nowrap}
td.code a{color:var(--accent);text-decoration:none;cursor:copy}
td.code a:hover{text-decoration:underline}
td.name a{color:var(--text);text-decoration:none;font-weight:600}
td.name a:hover{color:var(--accent)}
td.name small{display:block;color:var(--muted);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
td.date{white-space:nowrap;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
td.acts{white-space:nowrap}
td.acts .btn,td.acts button{margin:0 2px 2px 0}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
@media(max-width:860px){
  .tablewrap{background:none;border:0;overflow:visible}
  table,tbody,tr,td{display:block;min-width:0;width:100%}
  thead{display:none}
  tr{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:6px 12px}
  tbody tr:hover{background:var(--panel)}
  td{display:flex;gap:10px;border-bottom:0;padding:5px 0;align-items:baseline}
  td::before{content:attr(data-label);flex:0 0 84px;color:var(--muted);font-size:13.5px}
  td.name{font-size:15.5px}
  td.name>div{flex:1;min-width:0}
  td.acts{flex-wrap:wrap}
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>✎ Easypage</h1>
    <input id="q" class="grow" type="search" placeholder="ค้นหาชื่อเรื่อง / รหัส / เนื้อหา" autocomplete="off">
    <a class="btn primary" href="edit.html">+ เขียนใหม่</a>
  </div>
</header>
<main>
  <div id="err" class="msg err" hidden>เบราว์เซอร์นี้ไม่ยอมให้เก็บข้อมูลในเครื่อง (โหมดส่วนตัว?) — ข้อความที่เขียนจะไม่ถูกบันทึก</div>
  <div id="note" class="msg ok" hidden></div>

  <section class="card">
    <div class="stats">
      <div class="stat"><b id="sAll">0</b><span>หน้าทั้งหมด</span></div>
      <div class="stat wait"><b id="sPend">0</b><span>ยังไม่เผยแพร่ / แก้ไขแล้ว</span></div>
      <div class="stat ok"><b id="sDone">0</b><span>เผยแพร่แล้ว</span></div>
      <div class="stat"><b id="sClosed">0</b><span>ปิด / หมดอายุ</span></div>
    </div>
  </section>

  <div class="tablewrap">
    <table>
      <thead><tr><th>รหัส</th><th style="width:100%">ชื่อเรื่อง</th><th>แก้ไขล่าสุด</th><th>สถานะ</th><th>จัดการ</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden></div>
  </div>
</main>

<script src="md.js?v=4"></script>
<script src="store.js?v=4"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
/* เปิดด้วย index.html?=xxxxx → พาไปหน้าอ่าน */
if(EP.idFromUrl()){location.replace('view.php'+location.search);return}

function snippet(md){
  const t=md.replace(/```[\s\S]*?```/g,' ').replace(/!?\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/[#>*_~`|\-]+/g,' ').replace(/\s+/g,' ').trim();
  return t.length>110?t.slice(0,110)+'…':t;
}
function say(t,ok){const m=$('#note');m.hidden=false;m.className='msg '+(ok?'ok':'err');m.textContent=t}
function draw(){
  const all=EP.list(),qs=$('#q').value.trim().toLowerCase();
  const isClosed=p=>!!(p.closed&&p.publishedAt)||EP.isExpired(p);
  const closedN=all.filter(isClosed).length,pend=all.filter(p=>!isClosed(p)&&EP.isPending(p)).length;
  $('#sAll').textContent=all.length;$('#sPend').textContent=pend;$('#sClosed').textContent=closedN;$('#sDone').textContent=all.length-pend-closedN;
  const rows=all.filter(p=>!qs||p.id.includes(qs)||p.title.toLowerCase().includes(qs)||p.md.toLowerCase().includes(qs));
  const tb=$('#rows');tb.textContent='';
  const em=$('#empty');
  em.hidden=!!rows.length;
  em.textContent=all.length?'ไม่พบรายการที่ค้นหา':'ยังไม่มีหน้าที่เขียนไว้ — กด “+ เขียนใหม่” เพื่อเริ่ม หรือเปิดหน้าเขียนแล้วอัปโหลดไฟล์ .md';
  for(const p of rows){
    const tr=document.createElement('tr');
    const closed=!!(p.closed&&p.publishedAt),expired=!closed&&EP.isExpired(p),pending=EP.isPending(p),title=p.title||MD.titleOf(p.md);
    const td=(cls,label)=>{const c=document.createElement('td');if(cls)c.className=cls;c.dataset.label=label;tr.appendChild(c);return c};
    const a=document.createElement('a');a.href='#';a.textContent='?='+p.id;a.title='คัดลอกลิงก์แชร์';
    a.onclick=async e=>{e.preventDefault();EP.toast(await EP.copyText(EP.shareUrl(p.id))?'คัดลอกลิงก์แล้ว':'คัดลอกไม่ได้')};
    td('code','รหัส').appendChild(a);
    const n=td('name','ชื่อเรื่อง'),box=document.createElement('div');
    const na=document.createElement('a');na.href='edit.html?='+p.id;na.textContent=title;
    const sm=document.createElement('small');sm.textContent=snippet(p.md);
    box.append(na);if(sm.textContent)box.append(sm);n.appendChild(box);
    td('date','แก้ไข').textContent=EP.fmtDate(p.updated);
    const st=document.createElement('span');st.className='cs '+(closed?'C':expired?'E':pending?'N':'Y');st.textContent=closed?'ปิดอยู่':expired?'หมดอายุแล้ว':pending?(p.publishedAt?'แก้ไขหลังเผยแพร่':'ยังไม่เผยแพร่'):'เผยแพร่แล้ว';
    const stc=td('','สถานะ');stc.appendChild(st);
    if(p.publishedAt&&EP.expiryOf(p)){const sm2=document.createElement('small');sm2.className='muted';sm2.style.display='block';sm2.textContent=(expired?'หมดอายุเมื่อ ':'จะหมดอายุ ')+EP.fmtExpiry(p);stc.appendChild(sm2)}
    const ac=td('acts','จัดการ');
    const mk=(t,cls,fn,href)=>{
      const e=document.createElement(href?'a':'button');e.className=(cls||'')+' sm'+(href?' btn':'');e.textContent=t;
      if(href){e.href=href;e.target='_blank';e.rel='noopener'}else e.onclick=fn;
      ac.appendChild(e);
    };
    mk('แก้ไข','',null,'edit.html?='+p.id);
    mk('ดู','',null,'view.php?='+p.id);
    if(p.publishedAt){
      if(closed)mk('เปิดอีกครั้ง','',async()=>{
        const r=await EP.setClosed(p.id,false);draw();
        say(r.ok?'เปิด “'+title+'” แล้ว — ผู้อ่านเปิดลิงก์ได้อีกครั้ง':'เปิดไม่สำเร็จ: '+r.error,r.ok);
      });
      else mk('ปิด','danger',async()=>{
        if(!confirm('ปิด “'+title+'” (?='+p.id+') ?\n\n• ผู้ที่เปิดลิงก์จะเห็นหน้าแจ้งว่าบทความนี้ปิดอยู่ ไม่เห็นเนื้อหา\n• เนื้อหายังอยู่ครบ กด “เปิดอีกครั้ง” เมื่อไหร่ก็ได้'))return;
        const r=await EP.setClosed(p.id,true);draw();
        say(r.ok?'ปิด “'+title+'” แล้ว — ผู้ที่เปิดลิงก์จะเห็นหน้าแจ้งว่าปิดอยู่':'ปิดไม่สำเร็จ: '+r.error,r.ok);
      });
    }
    mk('ไฟล์ .md','',()=>EP.download(EP.fileName(p),EP.fileText(p),'text/markdown;charset=utf-8'));
    mk('ลบ','danger',()=>{
      if(!confirm('ลบ “'+title+'” (?='+p.id+') ออกจากเครื่องนี้?\n\n• ลบแล้วกู้คืนไม่ได้ (ควรสำรองไว้ก่อน)\n• ไฟล์ที่เผยแพร่บนเว็บแล้ว (p/'+p.id+'.md) จะไม่ถูกลบ'+(p.publishedAt?' และเครื่องนี้จะแก้/ปิดหน้านั้นไม่ได้อีก (กุญแจเจ้าของหน้าอยู่กับข้อมูลที่ลบ)':' — ต้องลบเองที่เซิร์ฟเวอร์')))return;
      EP.remove(p.id);draw();EP.toast('ลบแล้ว');
    });
    tb.appendChild(tr);
  }
}

$('#q').addEventListener('input',draw);
addEventListener('storage',draw);
addEventListener('pageshow',draw);
try{localStorage.setItem('easypage:t','1');localStorage.removeItem('easypage:t')}catch(e){$('#err').hidden=false}
draw();
EP.syncRemote().then(ch=>{if(ch)draw()});   // ตรวจสถานะจริงบนเซิร์ฟเวอร์ (ปิด/เปิด/ไฟล์หาย) ให้ตรงกัน
})();
</script>
</body>
</html>
